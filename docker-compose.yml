name: log-analytics-lambda
services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 25
    volumes: ["kafka-data:/var/lib/kafka/data"]
  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment:
      CASSANDRA_CLUSTER_NAME: LocalAnalytics
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes: ["cassandra-data:/var/lib/cassandra", "./cassandra/schema.cql:/schema.cql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' localhost >/dev/null 2>&1"]
      interval: 15s
      timeout: 12s
      retries: 25
      start_period: 60s
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports: ["9870:9870"]
    environment:
      CLUSTER_NAME: demo
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes: ["hdfs-name:/hadoop/dfs/name"]
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes: ["hdfs-data:/hadoop/dfs/data"]
    depends_on: [namenode]
  spark-stream:
    build: {context: ., dockerfile: spark/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: application-logs
      CASSANDRA_HOST: cassandra
      HDFS_URI: hdfs://namenode:9000
      SPARK_LOCAL_HOSTNAME: spark-stream
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5", "/app/spark/streaming.py"]
    volumes: ["./spark:/app/spark:ro"]
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      namenode: {condition: service_started}
      datanode: {condition: service_started}
    restart: on-failure
    ports: ["4040:4040"]
  dashboard:
    build: {context: ., dockerfile: dashboard/Dockerfile}
    environment: {CASSANDRA_HOST: cassandra}
    ports: ["8050:8050"]
    depends_on:
      cassandra: {condition: service_healthy}
    restart: on-failure
  producer:
    build: {context: ., dockerfile: producer/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      LOG_FILE: /shared/application.log
    volumes: ["./logs:/shared"]
    depends_on:
      kafka: {condition: service_healthy}
    profiles: ["demo"]
  nifi:
    image: apache/nifi:1.28.1
    environment:
      NIFI_WEB_HTTP_PORT: 8080
    ports: ["8080:8080"]
    volumes: ["./logs:/shared"]
    profiles: ["nifi"]
  nifi-setup:
    image: python:3.11-slim
    working_dir: /setup
    volumes: ["./nifi:/setup:ro"]
    command: ["sh", "-c", "pip install --quiet requests && python bootstrap.py"]
    depends_on: [nifi]
    profiles: ["nifi"]
volumes:
  kafka-data:
  cassandra-data:
  hdfs-name:
  hdfs-data:
